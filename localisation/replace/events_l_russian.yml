l_russian:
 MINIMIZE_EVENT: "§GЩёлкните§!, чтобы свернуть. Событие будет размещено в разделе §H«События и решения»§! области событий."
 AHEcor.1.t: "Начало коронации Карла I"
 AHEcor.1.desc: "Вена, город, который помнил Штрауса и кондитерские, теперь затянут в чёрный бархат. Трон Австрийской Эмо Империи пуст, истерзанная поражением Империя, нашла свой голос - хриплый, надрывный и слишком громкий для осеннего дня, коронация Карла I приближается."
 AHEcor.1.a: "Слава Карлу I!"
 AHEcor.1.b: "Мы можем использоать Карла в своих интересах...."
 AHEcor.1.c: "Долой эту клоунаду, за рабочий класс!"
 AHEinv.1.t: "Приглашение на коронацию элит других стран"
 AHEinv.1.desc: "Нейтралы-эмо-лоялисты взяли на себя организацию коронацию Карла - и это само по себе было показательно: люди, которые раньше организовывали концерты и расклеивали афиши, теперь составляли списки приглашённых и рассылали официальные письма"
 AHEinv.1.a: "Пригласить Кантскую элиту"
 AHEinv.1.b: "Пригласить Итальянскую элиту"
 AHEinv.1.c: "Пригласить Кубанскую элиту"