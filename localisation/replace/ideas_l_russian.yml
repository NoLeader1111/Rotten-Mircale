l_russian:
    AHE_music_culture: "Богатейшая музыкальная культура Европы"
    AHE_music_culture_desc: "Моцарт, Шуберт, Штраус… и даже хардкор. Да, именно в Австрии начиная с 2007 года рождаются самые агрессивные риффы и самые душевные брейкдауны. Венская опера соседствует с подвальными клубами, где хардкорщики крушат колонки, а после идут записывать подкасты. Эта музыкальная всеядность привлекает меломанов со всей Европы, поднимает рождаемость и заставляет заводы строиться быстрее – рабочим же нужно под что-то отбивать ритм между сменами."
    AHE_low_mortality: "Высокая смертность"
    AHE_low_mortality_desc: "После разгрома в Баварии нация впала в затяжную депрессию. Экономика рухнула, половина страны слушает эмокор и сводит счёты с жизнью. Кладбища расширяются быстрее, чем заводы. Молодёжь вместо "Хайль!" кричит "Всё бессмысленно"."
    AHE_economic_collapse: "Коллапс внутренней биржи"
    AHE_economic_collapse_desc: "Бавария была сердцем Австрийской экономики. С её потерей биржа рухнула. Цены скачут каждый час, деньги обесцениваются быстрее, чем их печатают. Военные заводы простаивают, стройки заморожены, народ копит спички и соль. 2022 год встречает австрийца с пустым кошельком и полной безысходностью и подпиской Spotify на месяц вместо хлеба."
    AHE_ethnic_conflicts: "Национальные споры"
    AHE_ethnic_conflicts_desc: "Венгры ненавидят чехов, чехи – румын, румыны – всех остальных. В 2022 году национальные распри выходят на улицы и в соцсети: драки на футболе, бойкоты венгерских колбасок в чешских супермаркетах, речи на чужих языках. Армия не может положиться на призывников из окраин, а политики только раздувают пламя в преддверии свержения монарха. Федерализация или смерть. Другого выбора нет. На горизонте – референдум о выходе Венгрии."
    AHE_no_professional_army: "Отсутствие профессиональной армии"
    AHE_no_professional_army_desc: "Договор о демилитаризации превратил армию в тень. Половина кадров спилась или выпилилась, четверть ушла в музыканты, остальные забыли, как держать винтовку. Казармы сданы под студии звукозаписи. Призывники прячутся в толстовках с капюшонами. Оборона страны держится на сарказме и старых пластинках."
    AHE_subcultural_split: "Субкультурный раскол"
    AHE_subcultural_split_desc: "Австрийская нация разделилась на два лагеря. Хардкорщики требуют чистоты жанра и агрессии, пост-хардкорщики делают ставку на мелодию и попсу. Стычки, срывы концертов в Вене. Империя трещит под тяжелые риффы."
    AHE_bureaucracy_degradation: "Деградация бюрократического аппарата"
    AHE_bureaucracy_degradation_desc: "Бавария была мотором чиновничьей машины Империи. После её потери венские канцелярии погрязли в коррупции и абсурде. Чтобы получить разрешение на туалетную бумагу, нужно три подписи, взятка и жертва богу бумагомарания. Документы путешествуют годами, а казна пустеет."
